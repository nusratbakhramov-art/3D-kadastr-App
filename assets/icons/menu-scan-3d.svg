<!-- "Skan qilish" — 3D box, drawn to the menu-tile family contract: 32x32,
     rx=8 #F4F4F4 tile, black 2px round stroke, glyph inset to ~8..24.
     The group is scaled from a 24 grid, so stroke-width is pre-divided by the
     scale (2 / 0.8 = 2.5) to land on the family's 2px. -->
