name: kadastr
description: "Kadastr — Flutter starter."
publish_to: 'none'
version: 1.0.5+39

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  flutter_native_splash: ^2.4.3
  photo_view: ^0.15.0
  shared_preferences: ^2.5.5
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  http: ^1.2.2
  http_parser: ^4.0.2
  model_viewer_plus: ^1.10.0
  path_provider: ^2.1.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  flutter_staggered_grid_view: ^0.7.0
  url_launcher: ^6.3.0
  in_app_review: ^2.0.9
  cached_network_image: ^3.4.1
  # Xarita tile'lari uchun alohida disk keshi (parcel_basemap.dart).
  flutter_cache_manager: ^3.4.1
  webview_flutter: ^4.10.0
  app_links: ^6.3.2
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.1
  pdfx: ^2.9.2
  app_badge_plus: ^1.2.0
  flutter_widget_from_html_core: ^0.16.0
  flutter_dotenv: ^6.0.1
  gpt_markdown: ^1.1.8
  # Splash intro roligi (assets/branding/splash/intro.mp4) — ovoz bilan.
  video_player: ^2.9.2

  # ── 360° panorama tikish quvuri (docs/panorama-360-plan.md) ──────────────
  # JPEG dekod/enkod va piksel ustida ishlash — OpenCV O'RNIGA.
  # SOF DART: platformaga (Android manifest, Gradle, iOS plist) TEGMAYDI.
  # ⚠️ `opencv_dart` ATAYLAB QO'SHILMAYDI — sof Dart quvuri qurilyapti.
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Qurilmada yuriladigan o'lchov/testlar (integration_test/**). 3-qadam
  # (MIL-0) JPEG dekod benchmarki AOT talab qiladi — `flutter drive --profile`,
  # u esa shu paketni va uning drayverini talab qiladi.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - .env
    - assets/3d/
    - assets/3d/lib/
    - assets/branding/
    - assets/branding/splash/
    - assets/branding/logo-frames/
    - assets/icons/
    - assets/images/
    - assets/images/auth/
    - assets/images/flags/
    - assets/images/home/
    - assets/images/payment/
    - assets/images/services/
    - assets/images/howitworks/

  fonts:
    - family: MTSCompact
      fonts:
        - asset: assets/fonts/MTSCompact-Regular.ttf
        - asset: assets/fonts/MTSCompact-Medium.ttf
          weight: 500
        - asset: assets/fonts/MTSCompact-Bold.ttf
          weight: 700
        - asset: assets/fonts/MTSCompact-Black.ttf
          weight: 900
    - family: MTSText
      fonts:
        - asset: assets/fonts/MTSText-Regular.ttf
        - asset: assets/fonts/MTSText-Medium.ttf
          weight: 500
        - asset: assets/fonts/MTSText-Bold.ttf
          weight: 700
        - asset: assets/fonts/MTSText-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/appicon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#034112"
  adaptive_icon_foreground: "assets/branding/appicon.png"

# DIQQAT: iOS LaunchScreen.storyboard va Android launch_background.xml QO'LDA
# tahrirlangan (VideoSplashScreen darhol ochilishi uchun tekis #040E07 fon,
# naqsh/logo yo'q). `dart run flutter_native_splash:create` ularni qayta
# yozadi — quyidagi sozlama shu sababli intro roligining rangiga moslangan.
flutter_native_splash:
  color: "#040E07"
  android_12:
    color: "#040E07"
  android: true
  ios: true
  web: false
